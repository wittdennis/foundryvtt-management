---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: foundry-argo-apps-bootstrapper
  namespace: foundry
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            foundryvtt: "true"
  template:
    metadata:
      name: "{{ nameNormalized }}-foundry-argo-apps-bootstrapper"
      namespace: foundry
      annotations:
        argocd.argoproj.io/client-side-apply-migration-manager: argocd-controller
    spec:
      project: foundry
      syncPolicy:
        automated:
          prune: true
        syncOptions:
          - ServerSideApply=true
      source:
        repoURL: https://git.derwitt.site/homelab/asgard
        targetRevision: HEAD
        path: "argo-apps/{{ nameNormalized }}"
        directory:
          recurse: true
      destination:
        name: homelab
        namespace: foundry
